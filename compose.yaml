services:
  newspulse:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?Set a random token of at least 24 characters}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUSTED_PRIVATE_FEEDS: ${TRUSTED_PRIVATE_FEEDS:-}
      POLL_CONCURRENCY: ${POLL_CONCURRENCY:-2}
      POLL_PER_HOST_CONCURRENCY: ${POLL_PER_HOST_CONCURRENCY:-1}
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-2}
      SCORE_CONCURRENCY: ${SCORE_CONCURRENCY:-2}
      ANALYSIS_ENDPOINT: ${ANALYSIS_ENDPOINT:-}
      ANALYSIS_KEY: ${ANALYSIS_KEY:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      ANALYSIS_TOTAL_TOKENS: ${ANALYSIS_TOTAL_TOKENS:-}
      ANALYSIS_TOTAL_MICROS: ${ANALYSIS_TOTAL_MICROS:-}
      ANALYSIS_CALL_MICROS: ${ANALYSIS_CALL_MICROS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      DELIVERY_ENABLED: ${DELIVERY_ENABLED:-false}
      DELIVERY_FROM: ${DELIVERY_FROM:-}
      DELIVERY_TO: ${DELIVERY_TO:-}
      DELIVERY_TIMEZONE: ${DELIVERY_TIMEZONE:-Europe/London}
      DELIVERY_TIME: ${DELIVERY_TIME:-06:00}
    volumes:
      - newspulse-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3000/health',{headers:{authorization:'Bearer '+process.env.MCP_TOKEN}});process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
volumes:
  newspulse-data:
