name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Format repair preview
        run: |
          bunx prettier --write src/story-grouping.ts tests/story-grouping.test.ts tests/story-persistence.test.ts
          for file in src/story-grouping.ts tests/story-grouping.test.ts tests/story-persistence.test.ts; do
            echo "FMT_START:$file"
            base64 -w0 "$file"
            echo
            echo "FMT_END:$file"
          done
      - run: bun run format:check
      - run: bun test
      - run: bun run smoke
      - name: Drizzle schema drift
        run: bun run db:generate && test -z "$(git status --porcelain -- drizzle)"
