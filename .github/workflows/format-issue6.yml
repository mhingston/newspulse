name: Temporary story fixture formatter
on:
  push:
    branches: [feat/issue-6-story-grouping]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write tests/story-grouping.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/story-grouping.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(stories): format recorded evaluation fixture test"
            git push
          fi
